# Variant B — nginx on client mini-VPS (Timeweb Cloud / Beget VPS).
# Replace EXAMPLE_DOMAIN, APP_PORT, paths. Then:
#   sudo ln -s /etc/nginx/sites-available/EXAMPLE_DOMAIN /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d EXAMPLE_DOMAIN -d www.EXAMPLE_DOMAIN
#   sudo nginx -t && sudo systemctl reload nginx

upstream client_app_EXAMPLE {
    server 127.0.0.1:APP_PORT;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name EXAMPLE_DOMAIN www.EXAMPLE_DOMAIN;

    # After certbot these lines are usually managed automatically:
    # ssl_certificate /etc/letsencrypt/live/EXAMPLE_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/EXAMPLE_DOMAIN/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://client_app_EXAMPLE;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
